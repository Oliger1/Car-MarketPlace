name: Deploy
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/mix
            git pull origin main
            docker compose pull || true
            docker compose build --no-cache
            docker compose up -d
            # Schema is applied by API startup (ensure_schema) — no Alembic
            docker compose exec -T api curl -fsS http://localhost:8000/api/health || exit 1
