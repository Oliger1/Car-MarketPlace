<!DOCTYPE html>
<html lang="sq">
<head><meta charset="utf-8"><title>Rezervimi u konfirmua</title></head>
<body style="font-family:Segoe UI,Arial,sans-serif;line-height:1.5;color:#1a1a1a;max-width:560px;margin:0 auto;padding:24px;">
  <p style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#0f6e6a;margin:0 0 8px;">Mix</p>
  <h1 style="font-size:22px;margin:0 0 16px;">Rezervimi u konfirmua</h1>
  <p>Përshëndetje {{requester_name}},</p>
  <p><strong>{{company_name}}</strong> konfirmoi rezervimin tuaj.</p>
  <ul>
    <li><strong>Makina:</strong> {{car_title}}</li>
    <li><strong>Datat:</strong> {{date_from}} → {{date_to}}</li>
  </ul>
  <p>Për detaje, kontaktoni kompaninë drejtpërdrejt.</p>
  <p style="font-size:12px;color:#999;margin-top:32px;">{{app_url}}</p>
</body>
</html>
