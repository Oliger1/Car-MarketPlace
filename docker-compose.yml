version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: mix-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mix}
      POSTGRES_USER: ${POSTGRES_USER:-mix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Tirane
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - mix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
    container_name: mix-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mix}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mix}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      UPLOAD_DIR: /uploads
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-5242880}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      TZ: Europe/Tirane
    volumes:
      - uploads_data:/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ./apps/web-complete1
      dockerfile: ../../infra/docker/web-complete1.Dockerfile
    container_name: mix-web-complete1
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
      API_URL: http://api:8000/api
      TZ: Europe/Tirane
    depends_on:
      - api
    networks:
      - mix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: mix-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./infra/caddy/snippets:/etc/caddy/snippets
      - caddy_data:/data
      - caddy_config:/config
      - uploads_data:/var/mix/uploads:ro
    depends_on:
      - web-complete1
      - api
    networks:
      - mix-network

networks:
  mix-network:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config: